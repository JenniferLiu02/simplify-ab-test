<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Key study results</title>
<desc id="desc">Among human respondents, Page B improved perceived usefulness by 0.50 points with p equal to .001, but did not change signup intent. Page C's signup intent was 0.25 points lower, not statistically significant in the human sample. In the combined sample, mostly synthetic respondents, Page C's signup intent was 0.40 points lower with p less than .001.</desc>
<rect width="1200" height="390" rx="24" fill="#f4f8fb"/>
<text x="50" y="59" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#15232d">What changed when the headline changed?</text>
<text x="50" y="89" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#52616b">Average paired difference from Page A · 1–5 rating scale</text>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="47" y="118" width="345" height="218" rx="18" fill="#fff" stroke="#15a4bc" stroke-width="2"/>
<text x="70" y="154" font-size="15" font-weight="700" fill="#057b91">HUMAN · B VS A</text>
<text x="70" y="221" font-size="54" font-weight="700" fill="#15232d">+0.50</text>
<text x="70" y="260" font-size="19" font-weight="700" fill="#273b46">Perceived usefulness</text>
<text x="70" y="296" font-size="15" fill="#52616b">n=24 paired ratings · p=.001</text>
<rect x="427" y="118" width="345" height="218" rx="18" fill="#fff" stroke="#c9d8e1" stroke-width="2"/>
<text x="450" y="154" font-size="15" font-weight="700" fill="#5b6b75">HUMAN · B VS A</text>
<text x="450" y="221" font-size="54" font-weight="700" fill="#15232d">0.00</text>
<text x="450" y="260" font-size="19" font-weight="700" fill="#273b46">Signup intent</text>
<text x="450" y="296" font-size="15" fill="#52616b">n=25 paired ratings · p=1.00</text>
<rect x="807" y="118" width="345" height="218" rx="18" fill="#fff" stroke="#e8bd67" stroke-width="2"/>
<text x="830" y="154" font-size="15" font-weight="700" fill="#8b5b08">HUMAN · C VS A</text>
<text x="830" y="221" font-size="54" font-weight="700" fill="#15232d">−0.25</text>
<text x="830" y="260" font-size="19" font-weight="700" fill="#273b46">Signup intent</text>
<text x="830" y="296" font-size="15" fill="#52616b">n=24 paired ratings · p=.21</text>
</g>
<text x="49" y="368" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#52616b">The human sample is small; synthetic results are reported separately below.</text>
</svg>